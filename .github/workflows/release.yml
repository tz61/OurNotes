name: Release

# Pushing a tag v<version> (the version in CMakeLists.txt, optionally with a suffix such
# as -rc1 for a pre-release) builds the packages for macOS, Windows and Linux and publishes
# them as a GitHub release. Running the workflow by hand (Actions > Release > Run workflow)
# only builds them; they are attached to the run as artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"
  HOMEBREW_NO_AUTO_UPDATE: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in CMakeLists.txt
        run: |
          version=$(sed -nE 's/^ +VERSION ([0-9][0-9.]*)$/\1/p' CMakeLists.txt | head -n1)
          echo "OurNotes $version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME#v}"
            if [[ "${tag%%-*}" != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)"
              exit 1
            fi
          fi
          extension=$(jq -r .version browser/chrome/manifest.json)
          if [[ "$extension" != "$version" ]]; then
            echo "::error::browser/chrome/manifest.json has version $extension, CMakeLists.txt $version"
            exit 1
          fi

  extension:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Zip the browser extension
        run: |
          version=$(jq -r .version browser/chrome/manifest.json)
          mkdir -p dist
          (cd browser/chrome && zip -r -X "../../dist/OurNotes-Connector-$version-chrome.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: browser-extension
          path: dist/*.zip
          if-no-files-found: error

  linux:
    needs: version
    # the oldest glibc on offer, so the packages also run on older distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Dependencies
        run: |
          sudo apt-get update
          # build dependencies, and the libraries of Qt's xcb plugin, which linuxdeploy bundles
          sudo apt-get install -y libssl-dev libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Build the AppImage and the tarball
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel  # GitHub's last Intel image, available until August 2027
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: OpenSSL
        run: brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
      - name: Build the disk image
        run: scripts/build-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: OpenSSL from vcpkg (MuPDF is built from source)
        run: vcpkg install openssl
      - name: Build the zip
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, extension, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a re-run: replace the files of the existing release
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" dist/* "${prerelease[@]}" --verify-tag \
              --title "OurNotes ${TAG#v}" --notes-file packaging/release-notes.md --generate-notes
          fi
