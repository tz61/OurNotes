name: CI

on:
  push:
  pull_request:

env:
  QT_VERSION: "6.8.3"
  OURNOTES_NO_NETWORK: "1"   # skip tests that call Crossref/arXiv/OpenLibrary

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgl1-mesa-dev libxkbcommon-dev libxcb1-dev
      - name: Configure (MuPDF is built from source)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  server-only:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build ournotesd without Qt or MuPDF
        run: |
          cmake -S . -B build -DOURNOTES_BUILD_GUI=OFF -DOURNOTES_BUILD_CLI=OFF
          cmake --build build -j4
          ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configure (MuPDF is built from source)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: OpenSSL from vcpkg (MuPDF is built from source)
        run: vcpkg install openssl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DOURNOTES_DEPLOY_QT=ON
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      # a zip that runs on any Windows 10/11 x64 (Qt, OpenSSL and the C++ runtime inside),
      # attached to the run under Artifacts
      - name: Package
        run: ./scripts/package-windows.ps1 -BuildDir build -NoBuild
      - uses: actions/upload-artifact@v4
        with:
          name: ournotes-windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
