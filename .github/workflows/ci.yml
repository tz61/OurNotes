name: CI

on:
  push:
  pull_request:

env:
  QT_VERSION: "6.8.3"
  FREEPEN_NO_NETWORK: "1"   # skip tests that call Crossref/arXiv/OpenLibrary

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libgl1-mesa-dev libxkbcommon-dev
      - name: Configure (MuPDF is built from source)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  server-only:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build freepend without Qt or MuPDF
        run: |
          cmake -S . -B build -DFREEPEN_BUILD_GUI=OFF -DFREEPEN_BUILD_CLI=OFF
          cmake --build build -j4
          ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Configure (MuPDF is built from source)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Build
        run: cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: MuPDF and OpenSSL from vcpkg
        run: vcpkg install mupdf openssl
      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        run: cmake --build build --config Release -j4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
